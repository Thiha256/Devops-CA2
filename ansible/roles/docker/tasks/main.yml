---
# =====================================================================
# Role: docker — installs Docker Engine + Compose plugin (idempotent).
# Implemented by: Lin Htut Win
# =====================================================================
- name: Update the apt package cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install prerequisite packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present

- name: Create the keyrings directory for Docker's signing key
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Add Docker's official GPG signing key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Add the official Docker apt repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable
    filename: docker
    state: present

- name: Install Docker Engine and the Docker Compose plugin
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present
    update_cache: true
  notify: Restart docker

- name: Ensure the Docker service is running and starts on boot
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Allow the 'ubuntu' user to run Docker without sudo
  ansible.builtin.user:
    name: ubuntu
    groups: docker
    append: true
