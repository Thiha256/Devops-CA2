---
# =====================================================================
# Shared NON-SECRET configuration — one source of truth so the setup is
# consistent and repeatable across every run. Implemented by: Lin Htut Win
# =====================================================================
# Application runtime environment on the server
app_user: rpapp
app_dir: /opt/rp-resource-centre
app_port: 3001

# Low inventory alert (n8n automation) — non-secret config.
# When a laptop model's available units drop to/below this number, the
# scheduled n8n workflow emails admin_alert_email to restock.
low_stock_threshold: 2
admin_alert_email: "linhtut989@gmail.com"   # <-- set to the real admin inbox

# Server locale
server_timezone: Asia/Singapore

# Docker packages installed during provisioning
docker_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-compose-plugin
