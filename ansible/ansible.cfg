# =====================================================================
# Ansible configuration — RP Resource Centre server provisioning
# Implemented by: Lin Htut Win — DevOps component (Ansible / IaC)
# =====================================================================
[defaults]
# Where Ansible looks for the list of servers to manage
inventory = inventory/aws_prod
# Where custom roles live (run playbooks from the ansible/ folder)
roles_path = roles
# EC2's default Ubuntu login user
remote_user = ubuntu
# Don't prompt to confirm the server's SSH fingerprint on first connect
host_key_checking = False
# Cleaner, human-readable output (YAML result format via the default callback)
result_format = yaml
retry_files_enabled = False

[privilege_escalation]
# Installing Docker needs root, so run tasks with sudo
become = True
become_method = sudo
