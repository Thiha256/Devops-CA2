name: CD Pipeline

# Run after CI completes on the main branch
on:
  workflow_run:
    workflows:
      - Node.js CI Pipeline
    types:
      - completed
    branches:
      - main

  # Allow you to test CD manually
  workflow_dispatch:

permissions:
  contents: read

# Prevent two deployments from running at the same time
concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Run when CI passes or when manually started
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          # Run as one root shell so `cd` (a shell builtin, which `sudo`
          # cannot run directly) persists for every command that follows
          script: |
            sudo bash -c '
              set -e

              # Enter the application directory prepared by Ansible
              cd /opt/rp-resource-centre

              # This directory is owned by rpapp (set by Ansible), but this
              # script runs as root. Since git v2.35.2, git refuses to run
              # git commands inside a repo it does not own unless the owner
              # is explicitly trusted, so tell it root is allowed here.
              git config --global --add safe.directory /opt/rp-resource-centre

              # First-time bootstrap: Ansible creates this directory but does
              # NOT clone the repo (code checkout stays out of the provisioning
              # lane). If there is no git repo here yet, initialise one pointing
              # at origin so the fetch/reset below works on the very first deploy
              # as well as every deploy after it.
              if [ ! -d .git ]; then
                git init -q
              fi

              if git remote get-url origin >/dev/null 2>&1; then
                git remote set-url origin https://github.com/Thiha256/Devops-CA2.git
              else
                git remote add origin https://github.com/Thiha256/Devops-CA2.git
              fi

              # Download the latest main branch
              git fetch origin main

              # Make the EC2 code exactly match GitHub main
              git reset --hard origin/main

              # Rebuild and restart the application
              docker compose up -d --build --remove-orphans

              # Display container status
              docker compose ps

              # Wait for the application to respond
              for attempt in $(seq 1 20); do
                if curl --fail --silent http://localhost:3001/ > /dev/null; then
                  echo "Deployment successful"
                  exit 0
                fi

                echo "Waiting for the application to start..."
                sleep 5
              done

              # Show logs when the application does not start
              echo "Application health check failed"
              docker compose logs --no-color --tail=100
              exit 1
            '
