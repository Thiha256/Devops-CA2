name: CD Pipeline

# Run CD after the CI workflow finishes,
# or allow manual execution from the Actions page
on:
  workflow_run:
    workflows:
      - Node.js CI Pipeline
    types:
      - completed
    branches:
      - main

  workflow_dispatch:

# CD only needs permission to read the repository
permissions:
  contents: read

# Prevent two deployments from running at the same time
concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Application to EC2

    # Automatic deployment:
    # Run only when CI succeeds.
    #
    # Manual deployment:
    # Run when workflow_dispatch is selected.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Connect to EC2 and deploy
        uses: appleboy/ssh-action@v1

        with:
          # Only the hostname—do not include tcp://, http:// or /
          host: ${{ secrets.EC2_HOST }}

          # Usually "ubuntu" for an Ubuntu EC2 instance
          username: ${{ secrets.EC2_USERNAME }}

          # Complete contents of your private SSH key
          key: ${{ secrets.EC2_SSH_KEY }}

          # Standard SSH port
          port: 22

          # Connection and deployment time limits
          timeout: 30s
          command_timeout: 10m

          script: |
            # Stop the deployment immediately if a command fails
            set -e

            # Location prepared by Ansible
            APP_DIR="/opt/rp-resource-centre"

            echo "======================================"
            echo "Starting CD deployment"
            echo "======================================"

            echo "Opening application directory..."
            cd "$APP_DIR"

            echo "Downloading the latest main branch..."
            sudo git fetch origin main

            echo "Updating EC2 code to match GitHub main..."
            sudo git reset --hard origin/main

            echo "Rebuilding and restarting Docker containers..."
            sudo docker compose up -d --build --remove-orphans

            echo "Current Docker container status:"
            sudo docker compose ps

            echo "Waiting for the application to start..."

            for attempt in $(seq 1 20); do
              if curl --fail --silent http://localhost:3001/ > /dev/null; then
                echo "======================================"
                echo "Deployment successful"
                echo "======================================"
                exit 0
              fi

              echo "Attempt $attempt of 20: application is not ready yet"
              sleep 5
            done

            echo "======================================"
            echo "Application health check failed"
            echo "======================================"

            echo "Container status:"
            sudo docker compose ps

            echo "Recent container logs:"
            sudo docker compose logs --no-color --tail=100

            exit 1