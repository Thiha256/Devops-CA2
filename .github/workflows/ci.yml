name: Node.js CI & DevSecOps Pipeline

# Run CI when code is pushed
on:
  push:
    branches:
      - main
      - lewin-dashboard-analytics-and-tests
      - cicd-setup

  pull_request:
    branches:
      - main

  workflow_dispatch:

# Give the workflow read-only repository access
permissions:
  contents: read
  security-events: write
  pull-requests: write
  actions: read

# Cancel the previous run when new code is pushed
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # 1. CORE CI (Wang Lin's Existing Work)
  # ==========================================
  continuous-integration:
    name: Install, Validate, Scan and Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # Download the project from the repository
      - name: Checkout repository
        uses: actions/checkout@v6

      # Prepare Node.js and npm cache
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm

      # Install exact dependencies from package-lock.json
      - name: Install dependencies
        run: npm ci

      # Check JavaScript syntax
      - name: Check JavaScript syntax
        run: npm run check

      # Scan the project for serious security vulnerabilities
      - name: Run Trivy security scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      # Run automated tests only when previous steps pass
      - name: Run automated tests
        run: npm test

  # ==========================================
  # 2. DEVSECOPS: Code Security Scan (CodeQL)
  # ==========================================
  devsecops-security-scan:
    name: DevSecOps SAST Code Analysis
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL Engine
        uses: github/codeql-action/init@v3
        with:
          languages: javascript

      - name: Run CodeQL Security Scan
        uses: github/codeql-action/analyze@v3
        with:
          upload: false

  # ==========================================
  # 3. ADVANCED TOOL: Trivy Vulnerability Scan
  # ==========================================
  devsecops-dependency-check:
    name: DevSecOps Dependency & Secret Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy Security & Secret Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          severity: 'CRITICAL,HIGH'