name: Node.js CI Pipeline

# Run CI when code is pushed
on:
  push:
    branches:
      - main
      - lewin-dashboard-analytics-and-tests
      - cicd-setup

  # Run CI when a pull request targets main
  pull_request:
    branches:
      - main

  # Allow manual execution
  workflow_dispatch:

# Give the workflow read-only repository access
permissions:
  contents: read

# Cancel the previous run when new code is pushed
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  continuous-integration:
    name: Install, Validate, Scan and Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # Download the project from the repository
      - name: Checkout repository
        uses: actions/checkout@v6

      # Prepare Node.js and npm cache
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm

      # Install exact dependencies from package-lock.json
      - name: Install dependencies
        run: npm ci

      # Check JavaScript syntax
      - name: Check JavaScript syntax
        run: npm run check

      # Scan the project for serious security vulnerabilities
      - name: Run Trivy security scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      # Run automated tests only when previous steps pass
      - name: Run automated tests
        run: npm test
