name: Node.js CI Pipeline

# Choose when the workflow runs
on:
  # Run when code is pushed to these branches
  push:
    branches:
      - main
      - lewin-dashboard-analytics-and-tests
      - cicd-setup

  # Run when a pull request targets main
  pull_request:
    branches:
      - main

  # Allow manual execution from the Actions page
  workflow_dispatch:

# Give the workflow read-only access to the repository
permissions:
  contents: read

# Cancel the previous CI run when newer code is pushed
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  continuous-integration:
    name: Install, Test and Build Docker
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Environment variables available to every step
    env:
      # Database connection settings
      DB_HOST: db
      DB_USER: root
      DB_DATABASE: resource_centre_db

      # Temporary CI database password from GitHub Secrets
      DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}

      # Non-sensitive application settings
      FINE_RATE_PER_DAY: "1"
      DUE_SOON_DAYS: "2"

    steps:
      # Download the repository files
      - name: Checkout repository
        uses: actions/checkout@v6

      # Install Node.js version 20
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm

      # Check whether the required database secret exists
      - name: Check required GitHub Secret
        run: |
          if [ -z "${DB_PASSWORD:-}" ]; then
            echo "::error::CI_DB_PASSWORD is missing from GitHub Secrets"
            exit 1
          fi

          echo "Required GitHub Secret is available"

      # Install exact dependency versions from package-lock.json
      - name: Install dependencies
        run: npm ci

      # Check JavaScript files for syntax errors
      - name: Check JavaScript syntax
        run: npm run check

      # Scan the project files for serious vulnerabilities
      - name: Run Trivy security scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      # Run the automated test files
      - name: Run automated tests
        run: npm test

      # Check whether docker-compose.yml is valid
      - name: Validate Docker Compose
        run: docker compose config --quiet

      # Build the Node.js Docker image
      - name: Build Docker image
        run: docker compose build app

      # Start the Node.js and MySQL containers
      - name: Start Docker Compose services
        run: docker compose up -d

      # Test whether the containerised application is working
      - name: Test containerised application
        run: |
          for attempt in {1..20}; do
            if curl --fail --silent http://localhost:3001/ > /dev/null; then
              echo "Application is running successfully"
              exit 0
            fi

            echo "Waiting for the application to start..."
            sleep 5
          done

          echo "::error::Application failed to start"
          exit 1

      # Show Docker logs when a previous step fails
      - name: Show Docker logs
        if: failure()
        run: docker compose logs --no-color

      # Always stop and remove the test containers
      - name: Stop Docker Compose services
        if: always()
        run: docker compose down -v

