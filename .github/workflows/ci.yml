name: Node.js CI & DevSecOps Pipeline

on:
  push:
    branches:
      - main
      - development
      - cicd-setup
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  pull-requests: write
  actions: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # 1. CORE CI (Wang Lin's Existing Work)
  # ==========================================
  continuous-integration:
    name: Install, Validate and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: npm run check

      - name: Run automated tests
        run: npm test

  # ==========================================
  # 2. DEVSECOPS: Code Security Scan (CodeQL)
  # ==========================================
  devsecops-security-scan:
    name: DevSecOps SAST Code Analysis
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL Engine
        uses: github/codeql-action/init@v3
        with:
          languages: javascript

      - name: Run CodeQL Security Scan
        uses: github/codeql-action/analyze@v3
        with:
          upload: false

  # ==========================================
  # 3. ADVANCED TOOL: Trivy Vulnerability Scan
  # ==========================================
  devsecops-dependency-check:
    name: DevSecOps Dependency & Secret Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy Security & Secret Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          severity: 'CRITICAL,HIGH'